timeout: 7200s

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-east4
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE_NAME: mtg-decks
  _CLOUD_RUN_MEMORY: 2Gi
  _CLOUD_RUN_CPU: "2"
  _CLOUD_RUN_TIMEOUT: "3600"
  _MAGE_LOCAL_AI_SERVER: "true"
  _MAGE_SERVER_HOST: beta.xmage.today
  _MAGE_SERVER_PORT: "17171"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --progress=plain
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "17888"
      - --memory
      - ${_CLOUD_RUN_MEMORY}
      - --cpu
      - ${_CLOUD_RUN_CPU}
      - --timeout
      - ${_CLOUD_RUN_TIMEOUT}
      - --set-env-vars
      - MAGE_GATEWAY_HOST=0.0.0.0,MAGE_LOCAL_AI_SERVER=${_MAGE_LOCAL_AI_SERVER},MAGE_SERVER_HOST=${_MAGE_SERVER_HOST},MAGE_SERVER_PORT=${_MAGE_SERVER_PORT}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
