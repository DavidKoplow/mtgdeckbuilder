name: Deploy MAGE gateway to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - cloudbuild.yaml
      - docker/**
      - mage/**
      - webgateway/**
      - .github/workflows/deploy-cloud-run.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-mage-gateway
  cancel-in-progress: true

env:
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'mtg-mage-gateway' }}
  REGION: ${{ vars.GCP_REGION || 'us-east4' }}
  REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'cloud-run-source-deploy' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy with Cloud Build
        run: |-
          gcloud builds submit \
            --config cloudbuild.yaml \
            --machine-type E2_HIGHCPU_8 \
            --timeout 7200s \
            --substitutions "_IMAGE_TAG=${{ github.sha }},_REGION=${{ env.REGION }},_REPOSITORY=${{ env.REPOSITORY }},_SERVICE=${{ env.SERVICE }},_CLOUD_RUN_MEMORY=${{ vars.CLOUD_RUN_MEMORY || '1536Mi' }},_CLOUD_RUN_CPU=${{ vars.CLOUD_RUN_CPU || '2' }},_CLOUD_RUN_TIMEOUT=${{ vars.CLOUD_RUN_TIMEOUT || '3600' }},_MAGE_LOCAL_AI_SERVER=${{ vars.MAGE_LOCAL_AI_SERVER || 'true' }},_MAGE_SERVER_HOST=${{ vars.MAGE_SERVER_HOST || 'beta.xmage.today' }},_MAGE_SERVER_PORT=${{ vars.MAGE_SERVER_PORT || '17171' }}" \
            .
