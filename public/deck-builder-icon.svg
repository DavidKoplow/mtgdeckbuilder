<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Pastel Rainbow Gradient -->
    <linearGradient id="pastelRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFADAD" /> <!-- Pastel Red -->
      <stop offset="25%" stop-color="#FFD6A5" /> <!-- Pastel Yellow/Orange -->
      <stop offset="50%" stop-color="#CAFFBF" /> <!-- Pastel Green -->
      <stop offset="75%" stop-color="#9BF6FF" /> <!-- Pastel Blue -->
      <stop offset="100%" stop-color="#BDB2FF" /> <!-- Pastel Purple -->
    </linearGradient>

    <!-- Clean Light Mode Drop Shadows -->
    <filter id="shadowLeft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="12" flood-opacity="0.06" />
    </filter>
    <filter id="shadowRight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-opacity="0.06" />
    </filter>
    <filter id="shadowCenter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Left Card (Slightly tilted left) -->
  <g transform="translate(256, 400) rotate(-22) translate(-256, -400)">
    <rect x="126" y="56" width="260" height="380" rx="32" fill="#FFFFFF" filter="url(#shadowLeft)" />
    <rect x="126" y="56" width="260" height="380" rx="32" fill="none" stroke="#9BF6FF" stroke-width="20" />
  </g>

  <!-- Right Card (Slightly tilted right) -->
  <g transform="translate(256, 400) rotate(22) translate(-256, -400)">
    <rect x="126" y="56" width="260" height="380" rx="32" fill="#FFFFFF" filter="url(#shadowRight)" />
    <rect x="126" y="56" width="260" height="380" rx="32" fill="none" stroke="#FFADAD" stroke-width="20" />
  </g>

  <!-- Center Card (Straight up) -->
  <rect x="116" y="46" width="280" height="400" rx="36" fill="#FFFFFF" filter="url(#shadowCenter)" />
  <rect x="116" y="46" width="280" height="400" rx="36" fill="none" stroke="url(#pastelRainbow)" stroke-width="28" />

  <!-- Center Emblem: Minimalist MTG "Spark" motif -->
  <!-- A symmetrical 4-point sparkle created with quadratic bezier curves -->
  <path d="M 256 136 Q 256 246 146 246 Q 256 246 256 356 Q 256 246 366 246 Q 256 246 256 136" fill="url(#pastelRainbow)" />

  <!-- Central core to hollow out the spark -->
  <circle cx="256" cy="246" r="20" fill="#FFFFFF" />
</svg>
